services:
  api:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://privpass:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/privpass
      REDIS_URL: redis://redis:6379/0
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env (python -c "import secrets;print(secrets.token_urlsafe(48))")}
      COOKIE_SECURE: "false"
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: privpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: privpass
    volumes: ["privpass_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:8.1-alpine
    restart: unless-stopped
volumes:
  privpass_pg:
