name: PrivPass SecretGuard

# Blocks merges on verified secrets and risky code. To make this a hard merge gate, mark the
# "SecretGuard gate" and "Bandit (Python SAST)" checks as REQUIRED in a branch-protection rule or
# ruleset for your default branch (see docs/SECRETGUARD-CI.md).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF upload to GitHub Code Scanning
  pull-requests: write     # PR summary comment

jobs:
  secretguard:
    name: SecretGuard gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep fingerprints stable across runs (required for baselines) without using a public key.
      PRIVPASS_SCAN_FINGERPRINT_KEY: ${{ secrets.SECRETGUARD_FINGERPRINT_KEY }}
    steps:
      - name: Checkout (full history - secrets live on in git history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt

      - name: Scan working tree (secrets + risky code)
        id: scan
        continue-on-error: true
        run: |
          BASELINE_ARGS=""
          if [ -f .secretguard-baseline.json ]; then BASELINE_ARGS="--baseline .secretguard-baseline.json"; fi
          VERIFY_ARGS=""
          if [ "${{ vars.SECRETGUARD_VERIFY }}" = "true" ]; then VERIFY_ARGS="--verify"; fi
          python tools/secret_scan.py . $BASELINE_ARGS $VERIFY_ARGS \
            --sarif secretguard.sarif --json secretguard.json \
            --fail-on high --fail-on-risky high --min-confidence 0.80

      - name: Scan full git history (every commit, every ref)
        id: history
        continue-on-error: true
        run: |
          BASELINE_ARGS=""
          if [ -f .secretguard-baseline.json ]; then BASELINE_ARGS="--baseline .secretguard-baseline.json"; fi
          python tools/secret_scan.py . --history --no-code-rules $BASELINE_ARGS \
            --json secretguard-history.json --fail-on high --min-confidence 0.80

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('secretguard.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: secretguard.sarif
          category: privpass-secretguard

      - name: Publish machine-readable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privpass-secretguard-report
          path: |
            secretguard.sarif
            secretguard.json
            secretguard-history.json
          if-no-files-found: ignore

      - name: Build AI remediation comment
        if: always() && github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: without it the offline engine is used
        run: |
          BLOCKED=""
          if [ "${{ steps.scan.outcome }}" = "failure" ] || [ "${{ steps.history.outcome }}" = "failure" ]; then BLOCKED="--blocked"; fi
          python tools/ai_pr_review.py --tree secretguard.json --history secretguard-history.json --out pr-comment.md $BLOCKED

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-comment.md')) return;
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes('<!-- privpass-secretguard -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Enforce security gate
        if: always()
        run: |
          if [ "${{ steps.scan.outcome }}" = "failure" ] || [ "${{ steps.history.outcome }}" = "failure" ]; then
            echo "::error::PrivPass SecretGuard blocked this change: verified HIGH/CRITICAL secrets or risky code (see the report artifact / PR comment)."
            exit 1
          fi
          echo "SecretGuard gate passed."

  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install bandit
      - name: Bandit - block on medium+ severity
        run: bandit -r app tools -ll

  semgrep:
    name: Semgrep (second opinion, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep
      - name: Semgrep community rules (report only)
        run: semgrep scan --config p/python --config p/javascript --exclude data --exclude tests --sarif --output semgrep.sarif || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore
